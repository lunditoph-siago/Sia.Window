name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BUILD_CONFIG: Release
      SOLUTION: Sia.Window.slnx
      PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/output

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.x

      - name: Get version from tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version tag: $TAG_NAME"
            exit 1
          fi

          echo "VERSION=${TAG_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore dependencies
        run: dotnet restore "$SOLUTION"

      - name: Build project
        run: >
          dotnet build "$SOLUTION"
          --configuration "$BUILD_CONFIG"
          -p:Version="$VERSION"
          --no-restore

      - name: Run tests
        run: >
          dotnet test "$SOLUTION"
          --configuration "$BUILD_CONFIG"
          --no-restore
          --no-build
          --blame-hang
          --blame-hang-timeout 5m
          --verbosity normal

      - name: Pack projects
        run: >
          dotnet pack "$SOLUTION"
          --configuration "$BUILD_CONFIG"
          -p:PackageVersion="$VERSION"
          --no-restore
          --no-build
          --output "$PACKAGE_OUTPUT_DIRECTORY"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ github.workspace }}/output/*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget.org

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      PACKAGE_OUTPUT_DIRECTORY: ${{ github.workspace }}/output

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.x

      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          name: nuget-packages
          path: ${{ github.workspace }}/output

      - name: Attest packages
        uses: actions/attest@v4
        with:
          subject-path: '${{ github.workspace }}/output/*.nupkg'

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "$PACKAGE_OUTPUT_DIRECTORY"/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

          dotnet nuget add source \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.repository_owner }}" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text

          dotnet nuget push "$PACKAGE_OUTPUT_DIRECTORY"/*.nupkg \
            --api-key "$GITHUB_TOKEN" \
            --source github \
            --skip-duplicate
